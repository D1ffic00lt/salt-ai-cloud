server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = / {
        return 302 /miniapp/;
    }

    location = /miniapp {
        return 301 /miniapp/;
    }

    location /miniapp/ {
        alias /usr/share/nginx/html/miniapp/;
        try_files $uri $uri/ /miniapp/index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}