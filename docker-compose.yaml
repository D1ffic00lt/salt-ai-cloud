services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-salt}:${POSTGRES_PASSWORD:-salt}@postgres:5432/${POSTGRES_DB:-salt_cloud}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - salt_ai_cloud_artifacts:/app/.saltai-cloud/artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  miniapp:
    build:
      context: .
      dockerfile: miniapp/Dockerfile
      args:
        VITE_SALTAI_CLOUD_API_BASE_URL: /api/v1
    depends_on:
      - api

  bot:
    profiles:
      - bot
    build:
      context: ./bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SALTAI_CLOUD_BASE_URL: http://api:8000
      SALTAI_CLOUD_API_PREFIX: /api/v1
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salt_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-salt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salt}
    ports:
      - "5432:5432"
    volumes:
      - salt_ai_cloud_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-salt} -d $${POSTGRES_DB:-salt_cloud}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - miniapp

volumes:
  salt_ai_cloud_postgres:
  salt_ai_cloud_artifacts: